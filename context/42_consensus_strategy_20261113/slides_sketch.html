<h2>Сеть 2027–2028: Москва и база Омск</h2>

<div class="path">Москва <span class="red">→</span> Сочи <span class="red">→</span><br>Волгоград <span class="red">→</span> Москва</div>
<div class="path">Москва <span class="red">→</span> Саратов <span class="red">→</span><br>Минводы <span class="red">→</span> Москва</div>
<p><b>6 прямых пар · по 2 RT/нед</b></p><p class="muted">Два рабочих борта выполняют оба обхода каждого треугольника в одни дни. Один резерв в Москве.</p>
</div><div class="column"><h3>Омск: сначала прямые рейсы</h3>

<p class="small"><b>При задержке</b> переносим этап до готовности. <b>Без новых бортов</b> нужен конкретный действующий самолёт и учёт потери его прежнего результата.</p>
<p class="foot">Проверены две датированные недели на вариант, обороты и возвраты на 3/4 и 7 ночей. При +20% времени полёта duty proxy Омск–Москва — 12:05; экипажи, ТО и слоты требуют подтверждения. Полная экономика новой сети не рассчитана. Старые +72,4/+40,4 млн ₽ на эти частоты не перенесены.</p>
