# Реестр источников данных. Один источник — одна секция.
# Его читает src/update.py: решает, что пора обновить, запускает загрузчик, проверяет результат
# и пишет журнал (data/raw/_manifest.json, data/raw/_runs.csv). Панель показывает свежесть отсюда.
#
# Поля:
#   name      — как источник называется для людей
#   owner     — кто публикует
#   url       — где лежат данные
#   kind      — telegram | http_file | manual | api
#   role      — data (данные для расчёта) | watch (лента для поиска новых цифр, см. src/scan_news.py)
#   cmd       — команда загрузки (пусто у ручных источников)
#   output    — файл, который появляется после загрузки
#   every_days — как часто обновлять
#   stale_days — через сколько дней без обновления данные считаются устаревшими
#   min_rows  — меньше строк = загрузка сломалась
#   license   — условия использования
#   feeds     — какие критерии или шаги расчёта питает

[favt_info]
name = "Росавиация: ограничения аэропортов"
owner = "Росавиация"
url = "https://t.me/s/favt_info"
kind = "telegram"
role = "data"
cmd = "src/fetch_kover.py"
output = "data/raw/favt_posts.csv"
every_days = 1
stale_days = 3
min_rows = 8000
license = "публичные сообщения госоргана"
feeds = ["дни «Ковра»", "сценарии"]

